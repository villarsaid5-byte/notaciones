<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Expresiones</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;

            width: 90%;

            margin-top: 15px;

        }

            margin-top: 20px;

        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Conversor de Expresiones</h1>

        <p class="descripcion">
            Convierte una expresión entre notación infija, prefija y posfija.
        </p>

        <label for="expresion">Escribe una expresión:</label>

        <input
            type="text"
            id="expresion"
            placeholder="Ejemplo: (A+B)*C"
        >

        <button onclick="convertir()">
            CONVERTIR
        </button>

        <div id="error" class="error"></div>

        <div class="resultados">

            <div class="resultado">
                <strong>Notación Infija:</strong>
                <span id="infija">---</span>
            </div>

            <div class="resultado">
                <strong>Notación Prefija:</strong>
                <span id="prefija">---</span>
            </div>

            <div class="resultado">
                <strong>Notación Posfija:</strong>
                <span id="posfija">---</span>
            </div>

        </div>

        <p class="ejemplo">
            Ejemplo: A+B*C → Prefija: +A*BC → Posfija: ABC*+
        </p>

    </div>

    <script>

        // Verifica si es operador
        function esOperador(c){
            return c === '+' ||
                   c === '-' ||
                   c === '*' ||
                   c === '/' ||
                   c === '^';
        }

        // Prioridad
        function prioridad(c){
            if(c === '^') return 3;
            if(c === '*' || c === '/') return 2;
            if(c === '+' || c === '-') return 1;
            return 0;
        }

        // Infija a Posfija
        function infijaAPosfija(expresion){

            let pila = [];
            let salida = [];

            for(let i = 0; i < expresion.length; i++){

                let caracter = expresion[i];

                if(caracter === ' '){
                    continue;
                }

                if(/[a-zA-Z0-9]/.test(caracter)){
                    salida.push(caracter);
                }

                else if(caracter === '('){
                    pila.push(caracter);
                }

                else if(caracter === ')'){

                    while(
                        pila.length > 0 &&
                        pila[pila.length - 1] !== '('
                    ){
                        salida.push(pila.pop());
                    }

                    if(pila.length === 0){
                        throw new Error("Paréntesis incorrectos");
                    }

                    pila.pop();
                }

                else if(esOperador(caracter)){

                    while(
                        pila.length > 0 &&
                        pila[pila.length - 1] !== '(' &&
                        prioridad(pila[pila.length - 1]) >= prioridad(caracter)
                    ){
                        salida.push(pila.pop());
                    }

                    pila.push(caracter);
                }

                else{
                    throw new Error(
                        "Caracter no válido: " + caracter
                    );
                }
            }

            while(pila.length > 0){

                if(pila[pila.length - 1] === '('){
                    throw new Error("Paréntesis incorrectos");
                }

                salida.push(pila.pop());
            }

            return salida.join('');
        }

        // Infija a Prefija
        function infijaAPrefija(expresion){

            let caracteres = expresion
                .replace(/\s/g,'')
                .split('');

            caracteres.reverse();

            for(let i = 0; i < caracteres.length; i++){

                if(caracteres[i] === '('){
                    caracteres[i] = ')';
                }
                else if(caracteres[i] === ')'){
                    caracteres[i] = '(';
                }
            }

            let invertida = caracteres.join('');

            let posfija = infijaAPosfija(invertida);

            return posfija.split('').reverse().join('');
        }

        // Conversión principal
        function convertir(){

            let expresion =
                document.getElementById("expresion").value.trim();

            let error =
                document.getElementById("error");

            error.textContent = "";

            if(expresion === ""){
                error.textContent =
                    "Escribe una expresión primero.";
                return;
            }

            try{

                let posfija =
                    infijaAPosfija(expresion);

                let prefija =
                    infijaAPrefija(expresion);

                document.getElementById("infija").textContent =
                    expresion.replace(/\s/g,'');

                document.getElementById("prefija").textContent =
                    prefija;

                document.getElementById("posfija").textContent =
                    posfija;
            }

            catch(e){
                error.textContent =
                    "Error: " + e.message;
            }
        }

        // Enter
        document
            .getElementById("expresion")
            .addEventListener("keydown", function(event){

                if(event.key === "Enter"){
                    convertir();
                }
            });

    </script>

</body>
</html>
